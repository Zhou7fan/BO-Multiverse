schema_version: 0.2.0
paper:
  id: Marshall_BritJournPoliSci_2015_GOYb
  title: Compensation or Constraint? Economic Globalization and Electoral Turnout
  osf: osf.io/qfm2g
hypothesis:
  text: Foreign ownership reduces turnout (ownership-constraint hypothesis), all OECD
    countries in the data.
  direction: none
  null_value: 0
support_decision_rule:
  direction: none
  null_value: 0
  test_type: two_sided
  alpha: 0.05
  close_tol: 0.0005384
  require_significance: false
  success_metric: tolerance
  objective_mode: normalized_distance
  targets_by_estimator:
    custom: 0.5384
  effect_measure: cohens_d
  tolerance_relative: 0.001
dataset:
  data_paths:
  - Turnout.dta
  read_code: 'import numpy as np, pandas as pd

    df = pd.read_stata(exp_dir + ''/data/Turnout.dta'', convert_categoricals=False)

    df[''year2''] = np.where(df[''year''] > 2010, np.floor(df[''year''] / 10), df[''year''])

    df[''logfdistock''] = np.log(df[''fdistock''].clip(lower=1e-9))

    df[''logpopden''] = np.log(df[''popden''].clip(lower=1e-9))

    df = df.sort_values([''cowcode'', ''year2'']).reset_index(drop=True)

    df[''lag_logfdistock''] = df.groupby(''cowcode'')[''logfdistock''].shift(1)

    df[''lag_logportequ''] = df.groupby(''cowcode'')[''logportequ''].shift(1)

    df[''lag_logtrade''] = df.groupby(''cowcode'')[''logtrade''].shift(1)

    '
experiment:
  mode: blind
  agent_can_see_paper_text: false
  agent_can_see_paper_code: false
  success_definition: '|d - 0.5384| <= 0.0005384'
  instantiation_notes: Reference path pinned from paper/Multi100 code; other menu
    options expanded to a 10^7-scale multiverse.
meta:
  strict_roles: false
  selection_seed: 20261024
  source: Multi100 OSF osf.io/qfm2g
  universe_count: 48988800
