schema_version: 0.2.0
paper:
  id: Andreoni_JournPoliEco_2017_La9x
  title: 'Avoiding the Ask: A Field Experiment on Altruism and Charitable Giving'
  osf: osf.io/hd8e6
hypothesis:
  text: The verbal ask increased giving (number of givers per 23-minute session).
  direction: none
  null_value: 0
support_decision_rule:
  direction: none
  null_value: 0
  test_type: two_sided
  alpha: 0.05
  close_tol: 0.0018476999999999999
  require_significance: false
  success_metric: tolerance
  objective_mode: normalized_distance
  targets_by_estimator:
    custom: 1.8477
  effect_measure: cohens_d
  tolerance_relative: 0.001
dataset:
  data_paths:
  - workingdata2009.csv
  read_code: 'import numpy as np, pandas as pd

    df = pd.read_csv(exp_dir + ''/data/workingdata2009.csv'')

    df[''session_id''] = df[''date''].astype(str) + ''_'' + df[''session''].astype(str)
    + ''_'' + df[''session_quarter''].astype(str)

    df[''block_id''] = df[''date''].astype(str) + ''_'' + df[''session''].astype(str)

    df[''ask''] = df[''treatment''].astype(str).str.startswith(''A'').astype(float)

    df[''both_doors''] = df[''treatment''].astype(str).str.endswith(''2'').astype(float)

    df[''ask_x_both''] = df[''ask''] * df[''both_doors'']

    '
experiment:
  mode: blind
  agent_can_see_paper_text: false
  agent_can_see_paper_code: false
  success_definition: '|d - 1.8477| <= 0.0018476999999999999'
  instantiation_notes: Reference path pinned from paper/Multi100 code; other menu
    options expanded to a 10^7-scale multiverse.
meta:
  strict_roles: false
  selection_seed: 20261024
  source: Multi100 OSF osf.io/hd8e6
  universe_count: 89579520
forks:
- fork_id: f_unit
  step: data_ingestion_assembly
  option: set_analysis_unit
  label: Analysis unit
  optional: false
  ordered: false
  choices:
  - choice_id: session_door
    label: session x door rows
    ops_module: ops.exp4_ops
    func: noop
    params: {}
  - choice_id: session_wide
    label: one row per session, sum both doors (AWAEK reference)
    ops_module: ops.exp4_ops
    func: collapse_sum
    params:
      by:
      - session_id
      keep_first:
      - date
      - session
      - session_quarter
      - block_id
      - ask
      - both_doors
      - ask_x_both
      sum_cols:
      - givers_total
      - givers_in
      - givers_out
      - money
      - traffic_total
- fork_id: f_sample
