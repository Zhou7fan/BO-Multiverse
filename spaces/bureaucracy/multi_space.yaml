schema_version: 0.2.0
paper:
  id: Jiang_AmJourPoliSci_2018_Rjp9
  title: 'Making Bureaucracy Work: Patronage Networks and Economic Development in
    China'
  osf: osf.io/8w4se
hypothesis:
  text: City leaders with informal ties to incumbent provincial leaders deliver faster
    economic growth than those without.
  direction: none
  null_value: 0
support_decision_rule:
  direction: none
  null_value: 0
  test_type: two_sided
  alpha: 0.05
  close_tol: 0.0005
  require_significance: false
  success_metric: tolerance
  objective_mode: normalized_distance
  targets_by_estimator:
    custom: 0.336
  effect_measure: cohens_d
  tolerance_relative: 0.001
dataset:
  data_paths:
  - replication.dta
  read_code: 'import numpy as np, pandas as pd

    df = pd.read_stata(exp_dir + ''/data/replication.dta'', convert_categoricals=False)

    df = df.sort_values([''cityid'', ''year'']).reset_index(drop=True)

    df[''lgdpidx''] = np.log(df[''gdpidx''].clip(lower=1e-9))

    df[''gdp_lead2''] = df.groupby(''cityid'')[''gdpidx''].shift(-2)

    df[''lgdp_lead2''] = df.groupby(''cityid'')[''lgdpidx''].shift(-2)

    df[''growth_lead2''] = (df[''gdp_lead2''] / df[''gdpidx''] - 1) * 100

    df[''growth_log''] = (df[''lgdp_lead2''] - df[''lgdpidx'']) * 100

    df[''growth_f2''] = (df[''f2gdpidx''] / df[''gdpidx''] - 1) * 100

    df[''n_obs_city''] = df.groupby(''cityid'')[''gdpidx''].transform(''count'')

    '
experiment:
  mode: blind
  agent_can_see_paper_text: false
  agent_can_see_paper_code: false
  success_definition: '|d - 0.336| <= 0.0005'
  instantiation_notes: Reference path pinned from paper/Multi100 code; other menu
    options expanded to a 10^7-scale multiverse.
meta:
  strict_roles: false
  selection_seed: 20261024
  source: Multi100 OSF osf.io/8w4se
  universe_count: 68040000
