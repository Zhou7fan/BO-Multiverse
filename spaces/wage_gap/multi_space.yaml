  - {choice_id: time_1981, label: "1981 cross-section", ops_module: "ops.wage_ops", func: "filter_rows", params: {expr: "wave == 1981"}}
  - {choice_id: time_1990, label: "1990 cross-section", ops_module: "ops.wage_ops", func: "filter_rows", params: {expr: "wave == 1990"}}
  - {choice_id: time_1999, label: "1999 cross-section", ops_module: "ops.wage_ops", func: "filter_rows", params: {expr: "wave == 1999"}}
