schema_version: "0.2.0"
paper:
  id: paper_0c7a2c63d8448666a3a7
  title: "Estimating wage disparities using foundation models"
  osf: ""
hypothesis:
  text: >
    In PSID 1990-2019 non-farm non-military wage workers, women earn a lower
    log hourly wage than men; the gap remains negative after conditioning on
    human capital, demographics, region and job attributes.
  direction: negative
  null_value: 0
support_decision_rule:
  direction: negative
  null_value: 0
  test_type: two_sided
  alpha: 0.05
  close_tol: 0.005
  require_significance: false
  success_metric: tolerance
  objective_mode: normalized_distance
  targets_by_estimator:
    custom: -0.1505
  effect_measure: log_wage_gap
  tolerance_relative: 0.03
dataset:
  data_paths:
  - psid_blau_kahn_2017.csv
  read_code: |
    import pandas as pd
    import numpy as np
    df = pd.read_csv(exp_dir + '/data/psid_blau_kahn_2017.csv')
    df['msa'] = df['smsa']
    df['otherrace'] = df['othrace']
    df['cb'] = df['unjob']
    df['gov'] = np.where(df['wtrgov'] == 1, 1.0, 0.0)
    df['lnwage'] = df['lnrealwg']
experiment:
  mode: blind
  agent_can_see_paper_text: false
  agent_can_see_paper_code: false
  success_definition: '|gap - (-0.1505)| <= 0.005'
  instantiation_notes: >
    Decision -> Option skeleton translated to executable forks.
    D1 occupation-history representation -> f_occ_history; D2 model form ->
    f_model_form; D4 debiasing -> f_debias; D5 summary estimator -> f_estimator;
    D6 overlap trim -> f_overlap_trim; D7 cross-fitting folds -> f_cv_folds;
    D8 standard errors -> f_se.  D3 (foundation-model pretraining) is not
    executable here and is omitted.  Extra menu options were added (sample /
    missing / variable construction / covariates) so that every fork is runnable
    and the space is large.  target = 2011-wave pooled OLS female coefficient
    (-0.1505).
meta:
  strict_roles: false
  selection_seed: 20261024
  source: "operation menu + paper_0c7a2c63d8448666a3a7"
  fork_count: 18
  universe_count: 117964800
